[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/games/educational-speech.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
