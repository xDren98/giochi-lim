<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐸 Froggy's Space Adventure - Spatial Words (Classe 1ª)</title>
  <script src="educational-speech.js?v=3.0"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      background: linear-gradient(135deg, #d1fae5 0%, #e0f2fe 50%, #fef3c7 100%);
      min-height: 100vh;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px 28px;
    }

    .app {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* HEADER */
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid #ffffff;
      border-radius: 24px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon { font-size: 2.3rem; }

    .brand h1 {
      font-size: clamp(1.2rem, 2.5vw, 1.75rem);
      color: #047857;
      line-height: 1.15;
    }

    .brand p {
      font-size: clamp(0.8rem, 1.4vw, 0.95rem);
      color: #475569;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-home, .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s, background-color 0.15s;
    }

    .btn-home {
      background: #fff3e0;
      color: #e65100;
      border: 2px solid #ff9800;
    }
    .btn-home:hover { background: #ffe0b2; }

    .btn-listen {
      background: #fef3c7;
      color: #92400e;
      border: 2px solid #f59e0b;
    }
    .btn-listen:hover { background: #fde68a; }

    .btn-sound {
      background: #eef2ff;
      color: #3730a3;
      border: 2px solid #818cf8;
    }

    .btn-home:active, .btn-pill:active { transform: scale(0.94); }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fefce8;
      border: 2px solid #facc15;
      color: #854d0e;
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 1.05rem;
    }

    /* MODE TABS */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #cbd5e1;
      color: #334155;
      padding: 9px 16px;
      border-radius: 16px;
      font-family: inherit;
      font-size: clamp(0.9rem, 1.7vw, 1.08rem);
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .tab-btn:hover { border-color: #4f46e5; color: #4f46e5; }
    .tab-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #3730a3;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
      transform: scale(1.04);
    }

    /* MAIN STAGE */
    .stage-card {
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      border: 5px solid #ffffff;
      padding: 18px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .scene-box {
      position: relative;
      width: 100%;
      height: clamp(230px, 38vh, 330px);
      background: linear-gradient(180deg, #ecfdf5 0%, #ccfbf1 100%);
      border: 3px solid #99f6e4;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    .cat-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #5eead4;
      color: #0f766e;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 800;
      z-index: 5;
    }

    .feedback-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .feedback-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .feedback-icon { font-size: 3.2rem; margin-bottom: 4px; }
    .feedback-title { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 900; color: #059669; }
    .feedback-sub { font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 700; color: #1e293b; margin-top: 4px; }

    #stage-svg {
      width: 100%;
      height: 100%;
      max-height: 310px;
    }

    /* CHOICES */
    .choices-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .choice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
      border: none;
      border-bottom: 6px solid rgba(0, 0, 0, 0.22);
      border-radius: 22px;
      color: #ffffff;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      transition: transform 0.14s, filter 0.15s;
    }

    .choice-btn:hover { filter: brightness(1.06); transform: translateY(-2px); }
    .choice-btn:active { transform: translateY(3px) scale(0.97); }
    .choice-icon { font-size: 2.4rem; margin-bottom: 4px; }
    .choice-label { font-size: clamp(1.35rem, 2.8vw, 1.9rem); letter-spacing: 1px; text-transform: uppercase; }
    .choice-sub { font-size: 0.95rem; font-weight: 700; opacity: 0.95; }

    .c-emerald { background: #10b981; border-bottom-color: #047857; }
    .c-amber   { background: #f59e0b; border-bottom-color: #b45309; }
    .c-sky     { background: #0ea5e9; border-bottom-color: #0369a1; }
    .c-indigo  { background: #6366f1; border-bottom-color: #4338ca; }
    .c-violet  { background: #8b5cf6; border-bottom-color: #6d28d9; }
    .c-rose    { background: #f43f5e; border-bottom-color: #be123c; }

    /* BOTTOM BAR */
    .bottom-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 6px 0;
      font-size: clamp(0.9rem, 1.6vw, 1.05rem);
      font-weight: 700;
      color: #475569;
    }

    .btn-next {
      background: #eef2ff;
      color: #4338ca;
      border: 2px solid #c7d2fe;
      border-radius: 999px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-next:hover { background: #e0e7ff; }

    @keyframes jump-happy {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-16px) scale(1.08, 0.95); }
      70% { transform: translateY(-6px) scale(0.98, 1.02); }
    }
    @keyframes shake-gentle {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .anim-jump { animation: jump-happy 0.6s ease-out; }
    .anim-shake { animation: shake-gentle 0.4s ease-in-out; }

    @media (max-width: 540px) {
      .choices-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <script>
    var soundEnabled = true;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBeep(freqs, type = 'sine', duration = 0.12) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        freqs.forEach((f, idx) => {
          setTimeout(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(f, ctx.currentTime);
            gain.gain.setValueAtTime(0.16, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
          }, idx * 90);
        });
      } catch (e) {}
    }

    function playSuccessSound() {
      playBeep([523.25, 659.25, 783.99, 1046.50], 'triangle', 0.2);
    }

    function playTryAgainSound() {
      playBeep([349.23, 293.66], 'sine', 0.18);
    }

      soundEnabled = !soundEnabled;
      window.soundEnabled = soundEnabled;
      document.getElementById('btnSoundToggle').textContent = soundEnabled ? '🔊 Audio ON' : '🔇 Audio OFF';
      if (typeof setSpeechEnabled === 'function') setSpeechEnabled(soundEnabled);
      if (!soundEnabled && typeof stopSpeech === 'function') stopSpeech();
    }

        </g>
      `;
    }

    function renderScene(q, isSuccess = false) {
      const bg = document.getElementById('background-elements');
      const frog = document.getElementById('froggy-group');
      const fg = document.getElementById('foreground-elements');

      bg.innerHTML = '';
      frog.innerHTML = '';
      fg.innerHTML = '';

      if (q.pair === 'IN_OUT') {
        bg.innerHTML = `
          <ellipse cx="180" cy="115" rx="72" ry="34" fill="#fef08a" stroke="#eab308" stroke-width="5" opacity="0.9"/>
          <ellipse cx="180" cy="115" rx="55" ry="24" fill="#fde047" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/>
          <text x="180" y="119" text-anchor="middle" font-size="12" font-weight="900" fill="#a16207" letter-spacing="1">MAGIC CIRCLE</text>
        `;
        if (q.sceneType === 'IN') {
          frog.innerHTML = getFroggySVG(148, 75, 1.05, isSuccess);
        } else {
          bg.innerHTML += `<path d="M 258 115 L 286 115" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>`;
          frog.innerHTML = getFroggySVG(270, 78, 1, isSuccess);
        }
      } else if (q.pair === 'LEFT_RIGHT') {
        bg.innerHTML = `
          <line x1="180" y1="25" x2="180" y2="155" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>
          <rect x="176" y="25" width="8" height="130" rx="4" fill="#64748b"/>
          <polygon points="184,30 216,42 184,54" fill="#f43f5e"/>
          <rect x="35" y="130" width="80" height="26" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
          <text x="75" y="147" text-anchor="middle" font-size="12" font-weight="900" fill="#0369a1">⬅️ LEFT</text>
          <rect x="245" y="130" width="80" height="26" rx="13" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
          <text x="285" y="147" text-anchor="middle" font-size="12" font-weight="900" fill="#4338ca">RIGHT ➡️</text>
        `;
        frog.innerHTML = q.sceneType === 'LEFT'
          ? getFroggySVG(45, 65, 1.05, isSuccess)
          : getFroggySVG(255, 65, 1.05, isSuccess);
      } else if (q.pair === 'FRONT_BACK') {
        if (q.sceneType === 'BACK') {
          frog.innerHTML = getFroggySVG(150, 20, 0.82, isSuccess);

              <text x="110" y="36" text-anchor="middle" font-size="13" font-weight="900" fill="#78350f" letter-spacing="2">WOODEN FENCE</text>
            </g>
          `;
        } else {

    function buildChoiceButtons(q) {
      const container = document.getElementById('choice-buttons-container');
      const isLeftAnswer = Math.random() < 0.5;
      const b1 = isLeftAnswer
        ? { val: q.answer, label: q.labelAnswer, sub: q.subAnswer, icon: q.iconAnswer, color: q.colorA, isCorrect: true }
        : { val: q.distractor, label: q.labelDistractor, sub: q.subDistractor, icon: q.iconDistractor, color: q.colorD, isCorrect: false };
      const b2 = isLeftAnswer
        ? { val: q.distractor, label: q.labelDistractor, sub: q.subDistractor, icon: q.iconDistractor, color: q.colorD, isCorrect: false }
        : { val: q.answer, label: q.labelAnswer, sub: q.subAnswer, icon: q.iconAnswer, color: q.colorA, isCorrect: true };

      container.innerHTML = `
        <button onclick="handleChoice(${b1.isCorrect})" class="choice-btn ${b1.color}" type="button">
          <span class="choice-icon">${b1.icon}</span>
          <span class="choice-label">${b1.label}</span>
          <span class="choice-sub">(${b1.sub})</span>
        </button>
        <button onclick="handleChoice(${b2.isCorrect})" class="choice-btn ${b2.color}" type="button">
          <span class="choice-icon">${b2.icon}</span>
          <span class="choice-label">${b2.label}</span>
          <span class="choice-sub">(${b2.sub})</span>
        </button>
      `;
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${cat}`).classList.add('active');
      nextQuestion();
    }

    function speakPrompt() {
      if (currentQ && typeof speakEnglish === 'function') {
        speakEnglish(currentQ.speechQuestion);
      }
    }

    function nextQuestion() {
      isLocked = false;
      document.getElementById('feedback-overlay').classList.remove('show');

      let pool = QUESTIONS;
      if (currentCategory !== 'ALL') {
        pool = QUESTIONS.filter(q => q.pair === currentCategory);
      }
      let available = pool.filter(q => !currentQ || q.id !== currentQ.id);
      if (available.length === 0) available = pool;

      currentQ = available[Math.floor(Math.random() * available.length)];
      document.getElementById('category-badge').innerText = currentQ.badge;
      document.getElementById('italian-hint').innerText = `💡 ${currentQ.italianSentence}`;

      renderScene(currentQ, false);
      buildChoiceButtons(currentQ);
      speakPrompt();
    }

    function handleChoice(isCorrect) {
      if (isLocked) return;

      if (isCorrect) {
        isLocked = true;
        score += 1;
        document.getElementById('score-counter').innerText = score;
        playSuccessSound();
        renderScene(currentQ, true);

        document.getElementById('feedback-icon').innerText = '⭐ 🎉';
        document.getElementById('feedback-text').innerText = 'GREAT JOB!';
        document.getElementById('feedback-sub').innerText = `${currentQ.speechSuccess} (${currentQ.italianSentence})`;
        document.getElementById('feedback-overlay').classList.add('show');

        if (typeof speakEnglish === 'function') speakEnglish(currentQ.speechSuccess);

        setTimeout(() => {
          nextQuestion();
        }, 2100);
      } else {
        playTryAgainSound();
        const stage = document.getElementById('stage-svg');
        stage.classList.remove('anim-shake');
        void stage.offsetWidth;
        stage.classList.add('anim-shake');
        setTimeout(() => stage.classList.remove('anim-shake'), 450);

        if (typeof speakEnglish === 'function') speakEnglish('Oops! Try again!');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      nextQuestion();
    });
  </script>
</body>
</html>
