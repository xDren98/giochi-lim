<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🌍 Where Is It? – Spatial Indicators Game (Classe 1ª)</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="educational-speech.js?v=3.0"></script>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      color: white;
      margin-bottom: 10px;
      animation: bounceIn 0.8s ease;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      text-shadow: 2px 3px 6px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }
    header p {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      opacity: 0.9;
      margin-top: 4px;
    }

    /* ===== SCOREBOARD ===== */
    #scoreboard {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border-radius: 50px;
      padding: 8px 24px;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    #scoreboard span { font-size: 1.3rem; }

    /* ===== GAME CARD ===== */
    #game-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 24px 28px 28px;
      max-width: 760px;
      width: 100%;
      animation: slideUp 0.5s ease;
    }

    /* ===== PROGRESS BAR ===== */
    #progress-wrap {
      background: #e0e0e0;
      border-radius: 20px;
      height: 10px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    /* ===== QUESTION LABEL ===== */
    #pair-label {
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #7c3aed;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* ===== QUESTION TEXT ===== */
    #question-text {
      text-align: center;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      color: #1e1b4b;
      font-weight: 800;
      margin-bottom: 20px;
      min-height: 60px;
      line-height: 1.4;
    }

    /* ===== SCENE AREA ===== */
    #scene {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 24px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      border: 4px solid #e0e0e0;
      background: #f0f4ff;
    }
    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ===== ANSWER BUTTONS ===== */
    #answers {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .answer-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      letter-spacing: 0.5px;
      min-width: 130px;
    }
    .answer-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 10px 28px rgba(102,126,234,0.5);
    }
    .answer-btn:active { transform: scale(0.97); }
    .answer-btn.correct {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      box-shadow: 0 6px 20px rgba(56,239,125,0.5);
      animation: pulse 0.4s ease;
    }
    .answer-btn.wrong {
      background: linear-gradient(135deg, #f7797d, #c0392b);
      box-shadow: 0 6px 20px rgba(192,57,43,0.4);
      animation: shake 0.4s ease;
    }
    .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }

    /* ===== FEEDBACK ===== */
    #feedback {
      text-align: center;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 800;
      min-height: 48px;
      transition: opacity 0.3s;
    }
    #feedback.show-correct { color: #059669; animation: bounceIn 0.4s; }
    #feedback.show-wrong   { color: #dc2626; animation: shake 0.4s; }

    /* ===== END SCREEN ===== */
    #end-screen {
      display: none;
      text-align: center;
      animation: bounceIn 0.6s ease;
    }
    #end-screen h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); color: #7c3aed; margin-bottom: 10px; }
    #end-screen p  { font-size: 1.3rem; color: #374151; margin-bottom: 20px; }
    #stars-display { font-size: 2.5rem; margin-bottom: 16px; }
    #final-score   { font-size: 1.8rem; font-weight: 800; color: #d97706; margin-bottom: 20px; }
    #restart-btn {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1e1b4b;
      border: none;
      border-radius: 50px;
      padding: 16px 48px;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(247,151,30,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
    }
    #restart-btn:hover { transform: translateY(-3px) scale(1.05); }

    /* ===== WORD CARDS (vocabulary strip) ===== */
    #vocab-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    .vocab-pill {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      color: #7c3aed;
      border-radius: 50px;
      padding: 6px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes bounceIn {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    footer {
      color: rgba(255,255,255,0.65);
      font-size: 0.8rem;
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>

<script>
// =====================================================================
//  DATA  – questions for each spatial pair
// =====================================================================
const PAIRS = [
  { id: "front-back",    pair: "FRONT / BACK",     color: "#dbeafe" },
  { id: "above-below",   pair: "ABOVE / BELOW",    color: "#dcfce7" },
  { id: "inside-outside",pair: "INSIDE / OUTSIDE", color: "#fef9c3" },
  { id: "near-far",      pair: "NEAR / FAR",       color: "#fce7f3" },
  { id: "left-right",    pair: "LEFT / RIGHT",     color: "#ede9fe" },
];

// Each question has: text, pair id, correct answer, draw function name, options
const QUESTIONS_POOL = [
  // ---- FRONT / BACK ----
  {
    pair: "front-back",
    question: "🐱 Where is the cat compared to the box?",
    draw: "cat_front_box",
    correct: "FRONT",
    options: ["FRONT", "BACK"],
  },
  {
    pair: "front-back",
    question: "🌲 Where is the tree compared to the house?",
    draw: "tree_behind_house",
    correct: "BACK",
    options: ["FRONT", "BACK"],
  },
  {
    pair: "front-back",
    question: "🐶 The dog is ___ the fence.",
    draw: "dog_front_fence",
    correct: "IN FRONT OF",
    options: ["IN FRONT OF", "BEHIND"],
  },
  {
    pair: "front-back",
    question: "🚗 Where is the red car?",
    draw: "car_behind_bus",
    correct: "BEHIND the bus",
    options: ["BEHIND the bus", "IN FRONT OF the bus"],
  },
  // ---- ABOVE / BELOW ----
  {
    pair: "above-below",
    question: "☁️ Where is the cloud compared to the sun?",
    draw: "cloud_above_sun",
    correct: "ABOVE",
    options: ["ABOVE", "BELOW"],
  },
  {
    pair: "above-below",
    question: "🐟 Where is the fish?",
    draw: "fish_below_boat",
    correct: "BELOW the boat",
    options: ["ABOVE the boat", "BELOW the boat"],
  },
  {
    pair: "above-below",
    question: "🦅 Where is the bird compared to the tree?",
    draw: "bird_above_tree",
    correct: "ABOVE",
    options: ["ABOVE", "BELOW"],
  },
  {
    pair: "above-below",
    question: "🌸 Where is the flower compared to the vase?",
    draw: "flower_above_vase",
    correct: "ABOVE",
    options: ["ABOVE", "BELOW"],
  },
  // ---- INSIDE / OUTSIDE ----
  {
    pair: "inside-outside",
    question: "🐭 Where is the mouse?",
    draw: "mouse_inside_house",
    correct: "INSIDE the house",
    options: ["INSIDE the house", "OUTSIDE the house"],
  },
  {
    pair: "inside-outside",
    question: "🏀 Where is the ball?",
    draw: "ball_outside_basket",
    correct: "OUTSIDE the basket",
    options: ["INSIDE the basket", "OUTSIDE the basket"],
  },
  {
    pair: "inside-outside",
    question: "🦋 Where is the butterfly?",
    draw: "butterfly_outside_jar",
    correct: "OUTSIDE the jar",
    options: ["INSIDE the jar", "OUTSIDE the jar"],
  },
  {
    pair: "inside-outside",
    question: "🍎 Where is the apple?",
    draw: "apple_inside_basket",
    correct: "INSIDE the basket",
    options: ["INSIDE the basket", "OUTSIDE the basket"],
  },
  // ---- NEAR / FAR ----
  {
    pair: "near-far",
    question: "🏠 Which house is NEAR the tree?",
    draw: "near_far_houses",
    correct: "The RED house",
    options: ["The RED house", "The BLUE house"],
  },
  {
    pair: "near-far",
    question: "⭐ Which star is FAR from the moon?",
    draw: "near_far_stars",
    correct: "The SMALL star",
    options: ["The BIG star", "The SMALL star"],
  },
  {
    pair: "near-far",
    question: "🐸 The frog is ___ the pond.",
    draw: "frog_near_pond",
    correct: "NEAR",
    options: ["NEAR", "FAR FROM"],
  },
  {
    pair: "near-far",
    question: "🚀 The rocket is ___ the Earth.",
    draw: "rocket_far_earth",
    correct: "FAR FROM",
    options: ["NEAR", "FAR FROM"],
  },
  // ---- LEFT / RIGHT ----
  {
    pair: "left-right",
    question: "🌟 On which side is the star?",
    draw: "star_left",
    correct: "LEFT",
    options: ["LEFT", "RIGHT"],
  },
  {
    pair: "left-right",
    question: "🍕 On which side is the pizza?",
    draw: "pizza_right",
    correct: "RIGHT",
    options: ["LEFT", "RIGHT"],
  },
  {
    pair: "left-right",
    question: "🐘 The elephant is on the ___ of the giraffe.",
    draw: "elephant_left_giraffe",
    correct: "LEFT",
    options: ["LEFT", "RIGHT"],
  },
  {
    pair: "left-right",
    question: "🌈 The rainbow is on the ___ of the cloud.",
    draw: "rainbow_right_cloud",
    correct: "RIGHT",
    options: ["LEFT", "RIGHT"],
  },
];

// =====================================================================
//  DRAW FUNCTIONS  – Canvas-based scenes
// =====================================================================
const W = 420, H = 420;

function clearCanvas(ctx) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#f0f4ff";
  ctx.fillRect(0, 0, W, H);
}

// helpers
function drawBox(ctx, x, y, w, h, color="#a0522d", label="BOX") {
  ctx.fillStyle = color;
  ctx.strokeStyle = "#5a3010";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(label, x+w/2, y+h/2+6);
}

function drawText(ctx, text, x, y, size=16, color="#1e1b4b", align="center") {
  ctx.font = `bold ${size}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
}

function drawEmoji(ctx, emoji, x, y, size=60) {
  ctx.font = `${size}px serif`;
  ctx.textAlign = "center";
  ctx.fillText(emoji, x, y);
}

function drawHouse(ctx, x, y, color="#ff6b6b", size=80) {
  // walls
  ctx.fillStyle = color;
  ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
  ctx.fillRect(x, y+size*0.4, size, size*0.6);
  ctx.strokeRect(x, y+size*0.4, size, size*0.6);
  // roof
  ctx.beginPath();
  ctx.moveTo(x-10, y+size*0.4);
  ctx.lineTo(x+size/2, y);
  ctx.lineTo(x+size+10, y+size*0.4);
  ctx.closePath();
  ctx.fillStyle = "#c0392b"; ctx.fill(); ctx.stroke();
  // door
  ctx.fillStyle = "#8B4513";
  ctx.fillRect(x+size*0.35, y+size*0.7, size*0.3, size*0.3);
}

function drawTree(ctx, x, y, size=70) {
  // trunk
  ctx.fillStyle = "#8B4513";
  ctx.fillRect(x+size*0.4, y+size*0.6, size*0.2, size*0.4);
  // foliage
  ctx.fillStyle = "#2ecc71";
  ctx.beginPath(); ctx.arc(x+size/2, y+size*0.4, size*0.4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle="#27ae60"; ctx.lineWidth=2; ctx.stroke();
}

function drawCloud(ctx, x, y, scale=1) {
  ctx.fillStyle = "white"; ctx.strokeStyle="#aaa"; ctx.lineWidth=2;
  const r = 28*scale;
  [[0,0],[r*0.8,r*0.3],[r*1.6,0],[r*2.0,r*0.4],[r*0.6,r*0.6],[r*1.4,r*0.6]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(x+dx, y+dy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  });
}

function drawSun(ctx, x, y, r=36) {
  ctx.fillStyle = "#ffd200"; ctx.strokeStyle="#f7971e"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*(r+6), y+Math.sin(a)*(r+6));
    ctx.lineTo(x+Math.cos(a)*(r+18), y+Math.sin(a)*(r+18));
    ctx.stroke();
  }
}

function drawWater(ctx, y) {
  ctx.fillStyle = "rgba(100,180,255,0.4)";
  ctx.fillRect(0, y, W, H-y);
  ctx.strokeStyle="rgba(50,120,200,0.4)"; ctx.lineWidth=2;
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.moveTo(0, y+30+i*30);
    ctx.bezierCurveTo(W/4,y+20+i*30, W*3/4,y+40+i*30, W,y+30+i*30);
    ctx.stroke();
  }
}

// ---- DRAWING SCENES ----
const DRAW = {
  cat_front_box(ctx) {
    clearCanvas(ctx);
    // Ground
    ctx.fillStyle="#c8f5b0"; ctx.fillRect(0,320,W,100);
    // Box
    drawBox(ctx, 240, 220, 120, 100, "#d4a574", "BOX");
    // Cat in FRONT
    drawEmoji(ctx, "🐱", 150, 300, 90);
    drawText(ctx, "← CAT          BOX →", 210, 370, 15, "#555");
  },
  tree_behind_house(ctx) {
    clearCanvas(ctx);
    ctx.fillStyle="#c8f5b0"; ctx.fillRect(0,300,W,120);
    // House first (in front)
    drawHouse(ctx, 130, 200, "#ff9f43", 130);
    // Tree BEHIND house (drawn at same level but partially covered)
    drawTree(ctx, 220, 180, 100);
    drawText(ctx, "Where is the tree?", W/2, 40, 17, "#7c3aed");
  },
  dog_front_fence(ctx) {
    clearCanvas(ctx);
    ctx.fillStyle="#c8f5b0"; ctx.fillRect(0,310,W,110);
    // Fence
    ctx.strokeStyle="#8B4513"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(50,220); ctx.lineTo(370,220); ctx.stroke();
    for(let x=60;x<380;x+=35){
      ctx.beginPath(); ctx.moveTo(x,180); ctx.lineTo(x,320); ctx.stroke();
    }
    // Dog in front of fence
    drawEmoji(ctx, "🐶", 210, 310, 100);
    drawText(ctx, "FENCE", 210, 210, 16, "#5a3010");
  },
  car_behind_bus(ctx) {
    clearCanvas(ctx);
    // Road
    ctx.fillStyle="#888"; ctx.fillRect(0,280,W,80);
    ctx.strokeStyle="white"; ctx.setLineDash([30,20]); ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(0,320); ctx.lineTo(W,320); ctx.stroke();
    ctx.setLineDash([]);
    // Bus
    ctx.fillStyle="#f7971e"; ctx.strokeStyle="#333"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.roundRect(80,210,180,80,10); ctx.fill(); ctx.stroke();
    drawText(ctx,"🚌",170,268,55);
    drawText(ctx,"BUS",170,296,13,"#333");
    // Car behind bus (smaller, behind)
    ctx.fillStyle="#e74c3c"; ctx.strokeStyle="#333"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(290,230,100,55,8); ctx.fill(); ctx.stroke();
    drawText(ctx,"🚗",338,274,40);
    drawText(ctx,"CAR",338,296,13,"#333");
  },
  cloud_above_sun(ctx) {
    clearCanvas(ctx);
    ctx.fillStyle="#87ceeb"; ctx.fillRect(0,0,W,H);
    // Sun (below)
    drawSun(ctx, 210, 310, 50);
    drawText(ctx,"SUN",210,374,15,"#f7971e");
    // Cloud above
    drawCloud(ctx, 100, 100, 1.4);
    drawText(ctx,"CLOUD",198,180,15,"#888");
  },
  fish_below_boat(ctx) {
    clearCanvas(ctx);
    ctx.fillStyle="#87ceeb"; ctx.fillRect(0,0,W,220);
    drawWater(ctx, 220);
    // Boat
    ctx.fillStyle="#e67e22"; ctx.strokeStyle="#333"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(80,220); ctx.lineTo(130,180); ctx.lineTo(290,180); ctx.lineTo(340,220); ctx.closePath();
    ctx.fill(); ctx.stroke();
    drawText(ctx,"⛵",210,185,55);
    drawText(ctx,"BOAT",210,170,15,"#333");
    // Fish below
    drawEmoji(ctx, "🐟", 210, 320, 70);
    drawText(ctx,"FISH",210,370,15,"#1565c0");
  },
  bird_above_tree(ctx) {
    clearCanvas(ctx);
    ctx.fillStyle="#87ceeb"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#c8f5b0"; ctx.fillRect(0,340,W,80);

// =====================================================================

function speakCurrentQuestion() {
  if (questions && questions[currentIndex]) {
    speakEnglish(questions[currentIndex].question);
  }
}

//  GAME STATE
// =====================================================================
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildQuestions() {
  // 4 questions per pair = 20 total
  return shuffle([...QUESTIONS_POOL]);
}

function restartGame() {
  score = 0;
  currentIndex = 0;
  questions = buildQuestions();
  document.getElementById("end-screen").style.display = "none";
  document.getElementById("game-area").style.display = "block";
  document.getElementById("score-display").textContent = "0";
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const total = questions.length;

  // Update progress bar & counters
  document.getElementById("progress-bar").style.width = `${(currentIndex/total)*100}%`;
  document.getElementById("q-display").textContent = currentIndex + 1;
  document.getElementById("q-total").textContent = total;

  // Find pair info
  const pairInfo = PAIRS.find(p => p.id === q.pair);
  document.getElementById("pair-label").textContent = `Pair: ${pairInfo.pair}`;
  document.getElementById("game-card").style.background = "white";
  document.getElementById("scene").style.background = pairInfo.color;

  // Question text
  document.getElementById("question-text").textContent = q.question;
  speakCurrentQuestion();

  // Draw scene
  const canvas = document.getElementById("scene-canvas");
  const ctx = canvas.getContext("2d");
  if(DRAW[q.draw]) DRAW[q.draw](ctx);

  // Build shuffled answer buttons
  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";
  const opts = shuffle([...q.options]);
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, q.correct);
    answersDiv.appendChild(btn);
  });

  // Clear feedback
  const fb = document.getElementById("feedback");
  fb.textContent = "";
  fb.className = "";

  // Vocab strip
  buildVocabStrip(q.pair);

  answered = false;
}

function checkAnswer(selected, correct) {
  if(answered) return;
  answered = true;

  const fb = document.getElementById("feedback");
  const btns = document.querySelectorAll(".answer-btn");

  btns.forEach(b => {
    b.disabled = true;
    if(b.textContent === correct) b.classList.add("correct");
  });

  if(selected === correct) {
    score++;
    document.getElementById("score-display").textContent = score;
    fb.textContent = ["🎉 Excellent!", "⭐ Well done!", "🌟 Super!", "✅ Correct!", "🏆 Bravo!", "👏 Amazing!"][Math.floor(Math.random()*6)];
    fb.className = "show-correct";
    // Find and highlight the button clicked
    btns.forEach(b => { if(b.textContent === selected) b.classList.add("correct"); });
    playSound(true);
    speakEnglish("Super! " + selected);
  } else {
    fb.textContent = `❌ Not quite! The answer is: ${correct}`;
    fb.className = "show-wrong";
    btns.forEach(b => { if(b.textContent === selected) b.classList.add("wrong"); });
    playSound(false);
    speakEnglish(correct);
  }

  setTimeout(() => {
    currentIndex++;
    if(currentIndex < questions.length) {
      renderQuestion();
    } else {
      showEndScreen();
    }
  }, 2200);
}

function showEndScreen() {
  document.getElementById("game-area").style.display = "none";
  document.getElementById("end-screen").style.display = "block";
  document.getElementById("progress-bar").style.width = "100%";

  const total = questions.length;
  const pct = score / total;
  let stars = "⭐⭐⭐";
  let msg = "Perfect score! You are a spatial superstar! 🌟";
  if(pct < 1)   { stars = "⭐⭐⭐"; msg = "Wonderful!"; }
  if(pct < 0.8) { stars = "⭐⭐"; msg = "Great job! Keep practising! 💪"; }
  if(pct < 0.6) { stars = "⭐"; msg = "Good try! Let's play again! 🔄"; }
  if(pct === 1) { stars = "🏆⭐⭐⭐🏆"; msg = "Perfect score! You are a spatial superstar! 🌟"; }

  document.getElementById("stars-display").textContent = stars;
  if (typeof confetti === "function") { confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); }
  speakEnglish("Well done! Amazing job!");
  document.getElementById("final-score").textContent = `${score} / ${total} correct answers`;
  document.querySelector("#end-screen p").textContent = msg;
}

// =====================================================================
//  VOCABULARY STRIP
// =====================================================================
const VOCAB = {
  "front-back":    [["IN FRONT OF","davanti"],["BEHIND","dietro"]],
  "above-below":   [["ABOVE","sopra"],["BELOW","sotto"]],
  "inside-outside":[["INSIDE","dentro"],["OUTSIDE","fuori"]],
  "near-far":      [["NEAR","vicino"],["FAR FROM","lontano"]],
  "left-right":    [["LEFT","sinistra"],["RIGHT","destra"]],
};

function buildVocabStrip(pairId) {
  const strip = document.getElementById("vocab-strip");
  strip.innerHTML = "";
  (VOCAB[pairId]||[]).forEach(([eng,ita])=>{
    const pill = document.createElement("div");
    pill.className = "vocab-pill";
    pill.textContent = `${eng} = ${ita}`;
    strip.appendChild(pill);
  });
}

// =====================================================================
//  SIMPLE SOUND FEEDBACK (Web Audio API)
// =====================================================================
function playSound(correct) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if(correct) {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime+0.15);
      osc.frequency.setValueAtTime(784, ctx.currentTime+0.30);
    } else {
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.setValueAtTime(220, ctx.currentTime+0.2);
    }
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
    osc.start(); osc.stop(ctx.currentTime+0.7);
  } catch(e) {}
}

// =====================================================================
//  INIT
// =====================================================================
restartGame();
